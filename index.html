<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/png" href="/1000.png" />

    <!-- Metadane startowe. Komponent SEO.jsx aktualizuje je po uruchomieniu React. -->
    <title>SellFix | Serwis GSM Kielce</title>
    <meta
      name="description"
      content="SellFix – serwis telefonów w Kielcach przy ul. Warszawskiej 28. Naprawa iPhone, Samsung i Xiaomi, skup telefonów oraz sprzedaż urządzeń."
    />

    <!-- Google Consent Mode v2: domyślna odmowa przed załadowaniem tagu. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }

      gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        wait_for_update: 500
      });

      // Przywróć zapisany wybór przed uruchomieniem Google tag.
      // Klucze są zgodne z CookieBanner_gotowy.jsx.
      (function () {
        try {
          var analytics = false;
          var marketing = false;
          var hasChoice = false;
          var stored = localStorage.getItem("sellfix-cookie-consent-v2");
          if (stored) {
            var choice = JSON.parse(stored);
            if (typeof choice.analytics === "boolean" && typeof choice.marketing === "boolean") {
              analytics = choice.analytics;
              marketing = choice.marketing;
              hasChoice = true;
            }
          }
          if (!hasChoice) {
            var legacy = localStorage.getItem("sellfix-cookie-consent");
            if (legacy === "accepted" || legacy === "rejected") {
              analytics = legacy === "accepted";
              marketing = legacy === "accepted";
              hasChoice = true;
            }
          }
          if (hasChoice) {
            gtag("consent", "update", {
              analytics_storage: analytics ? "granted" : "denied",
              ad_storage: marketing ? "granted" : "denied",
              ad_user_data: marketing ? "granted" : "denied",
              ad_personalization: marketing ? "granted" : "denied"
            });
          }
        } catch (error) {
          // Brak localStorage lub uszkodzony zapis: pozostaje domyślna odmowa.
        }
      })();
    </script>

    <!-- Zachowany identyfikator Google Ads z oryginalnego pliku. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11430872989"></script>
    <script>
      gtag("js", new Date());
      gtag("config", "AW-11430872989");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
